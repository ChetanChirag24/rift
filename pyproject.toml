[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riftdiff"
dynamic = ["version"]
description = "Local-first data diff, powered by DuckDB. See exactly what changed before you merge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chetan Chirag" }]
keywords = ["diff", "data", "csv", "parquet", "duckdb", "data-quality", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "duckdb>=0.10.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rift = "riftdiff.cli:main"

[tool.setuptools.dynamic]
version = { attr = "riftdiff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
