<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="rift: see exactly what changed in your data before you merge it">
<title>rift: see exactly what changed in your data before you merge it</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#151b36"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#fbbf24" stop-opacity="0.05"/>
  <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
  <stop offset="1" stop-color="#fbbf24" stop-opacity="0.05"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="40" height="20" patternUnits="userSpaceOnUse">
  <path d="M0 10 L20 0 L40 10 L20 20 Z" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
</pattern>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

.float { animation: float 6s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
.scan { animation: scan 6s linear infinite; opacity: 0; }
@keyframes scan {
  0% { transform: translate(0,0); opacity: 0 }
  5% { opacity: 1 } 75% { opacity: 1 }
  80%,100% { transform: translate(-120px,60px); opacity: 0 } }

.chg1 { animation: chg1 6s ease-out infinite; }
@keyframes chg1 { 0%,21.3% { opacity: 0 } 24.3% { opacity: 1 } 29.3%,90% { opacity: .75 } 98%,100% { opacity: 0 } }
.beam1 { animation: beam1 6s ease-out infinite; }
@keyframes beam1 { 0%,21.3% { opacity: 0 } 25.3%,90% { opacity: 1 } 98%,100% { opacity: 0 } }
.chg4 { animation: chg4 6s ease-out infinite; }
@keyframes chg4 { 0%,57.3% { opacity: 0 } 60.3% { opacity: 1 } 65.3%,90% { opacity: .75 } 98%,100% { opacity: 0 } }
.beam4 { animation: beam4 6s ease-out infinite; }
@keyframes beam4 { 0%,57.3% { opacity: 0 } 61.3%,90% { opacity: 1 } 98%,100% { opacity: 0 } }
.p { animation: rise 1.6s linear infinite; }
.p1 { animation-delay: .53s; } .p2 { animation-delay: 1.06s; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 }
  100% { transform: translateY(-155px); opacity: 0 } }
.removed { animation: removed 6s ease-in infinite; }
@keyframes removed { 0%,43.3% { transform: translateY(0); opacity: 1 }
  58.3%,95% { transform: translateY(26px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
.removed-glow { animation: rglow 6s linear infinite; }
@keyframes rglow { 0%,33.3% { opacity: 0 } 36.3%,58.3% { opacity: 1 } 100% { opacity: 1 } }
.added { animation: added 6s cubic-bezier(.2,.9,.3,1.2) infinite; }
@keyframes added { 0%,45.3% { transform: translateY(-34px); opacity: 0 }
  55.3%,92% { transform: translateY(0); opacity: 1 } 98%,100% { transform: translateY(0); opacity: 0 } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }

</style>

<rect width="900" height="400" rx="18" fill="url(#bg)"/><rect x="0.5" y="0.5" width="899" height="399" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<rect width="900" height="400" rx="18" fill="url(#grid)"/>
<text x="56" y="138" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#brand)">rift</text>
<rect class="blink" x="184" y="80" width="12" height="62" rx="2" fill="#22d3ee"/>
<text x="58" y="186" font-size="22" font-weight="600" fill="#e2e8f0">See exactly what changed in your data</text>
<text x="58" y="216" font-size="22" font-weight="600" fill="#e2e8f0">— before you merge it.</text>
<rect x="58" y="252" width="93.9" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="104.95" y="270.5" font-size="12.5" fill="#e2e8f0" text-anchor="middle">local-first</text><rect x="159.9" y="252" width="114.6" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="217.2" y="270.5" font-size="12.5" fill="#e2e8f0" text-anchor="middle">DuckDB-powered</text><rect x="282.5" y="252" width="156" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="360.5" y="270.5" font-size="12.5" fill="#e2e8f0" text-anchor="middle">CSV · Parquet · JSON</text><rect x="446.5" y="252" width="80.1" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="486.55" y="270.5" font-size="12.5" fill="#e2e8f0" text-anchor="middle">git-aware</text>
<text class="mono" x="58" y="326" font-size="14"><tspan fill="#34d399">+ added</tspan><tspan dx="18" fill="#f87171">− removed</tspan><tspan dx="18" fill="#fbbf24">~ changed</tspan><tspan dx="18" fill="#64748b">= unchanged</tspan></text>
<g transform="translate(675,38)"><g class="float">
  <g transform="translate(0,175)"><polygon points="-120,60 40,140 40,156 -120,76" fill="#0f172a" stroke="#334155" stroke-width="1"/><polygon points="160,80 40,140 40,156 160,96" fill="#162036" stroke="#334155" stroke-width="1"/><polygon points="0,0 160,80 40,140 -120,60" fill="#1e293b" stroke="#334155" stroke-width="1" /><polygon points="0,8 144,80 132,86 -12,14" fill="#2b3a52" /><polygon points="-18,17 126,89 114,95 -30,23" fill="#2b3a52" /><polygon class="chg1" points="-18,17 126,89 114,95 -30,23" fill="#fbbf24" filter="url(#glow)"/><g class="removed"><polygon points="-36,26 108,98 96,104 -48,32" fill="#2b3a52" /><g class="removed-glow"><polygon points="-36,26 108,98 96,104 -48,32" fill="#f87171" filter="url(#glow)"/></g></g><polygon points="-54,35 90,107 78,113 -66,41" fill="#2b3a52" /><polygon points="-72,44 72,116 60,122 -84,50" fill="#2b3a52" /><polygon class="chg4" points="-72,44 72,116 60,122 -84,50" fill="#fbbf24" filter="url(#glow)"/><polygon points="-90,53 54,125 42,131 -102,59" fill="#2b3a52" /><g class="scan"><polygon points="2,-1 162,79 158,81 -2,1" fill="#22d3ee" opacity="0.85" filter="url(#glow)"/></g><text class="mono" x="0" y="0" font-size="10" fill="#94a3b8" transform="translate(-114,74) skewY(26.565)">before.csv</text></g>
  <line x1="0" y1="16" x2="0" y2="175" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="2 5"/><line x1="160" y1="96" x2="160" y2="255" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="2 5"/><line x1="-120" y1="76" x2="-120" y2="235" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="2 5"/><line x1="40" y1="156" x2="40" y2="315" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="2 5"/>
  <g class="beam1"><rect x="46" y="72" width="4" height="159" fill="url(#beam)"/><circle class="p p0" cx="48" cy="231" r="2.2" fill="#fbbf24" filter="url(#glow)"/><circle class="p p1" cx="48" cy="231" r="2.2" fill="#fbbf24" filter="url(#glow)"/><circle class="p p2" cx="48" cy="231" r="2.2" fill="#fbbf24" filter="url(#glow)"/></g><g class="beam4"><rect x="-8" y="99" width="4" height="159" fill="url(#beam)"/><circle class="p p0" cx="-6" cy="258" r="2.2" fill="#fbbf24" filter="url(#glow)"/><circle class="p p1" cx="-6" cy="258" r="2.2" fill="#fbbf24" filter="url(#glow)"/><circle class="p p2" cx="-6" cy="258" r="2.2" fill="#fbbf24" filter="url(#glow)"/></g>
  <polygon points="-120,60 40,140 40,156 -120,76" fill="#0f172a" stroke="#334155" stroke-width="1"/><polygon points="160,80 40,140 40,156 160,96" fill="#162036" stroke="#334155" stroke-width="1"/><polygon points="0,0 160,80 40,140 -120,60" fill="#1e293b" stroke="#334155" stroke-width="1" /><polygon points="0,8 144,80 132,86 -12,14" fill="#2b3a52" /><polygon points="-18,17 126,89 114,95 -30,23" fill="#2b3a52" /><polygon class="chg1" points="-18,17 126,89 114,95 -30,23" fill="#fbbf24" filter="url(#glow)"/><polygon points="-36,26 108,98 96,104 -48,32" fill="#2b3a52" /><polygon points="-54,35 90,107 78,113 -66,41" fill="none" stroke="#34d399" stroke-opacity="0.5" stroke-dasharray="4 3"/><g class="added"><polygon points="-54,35 90,107 78,113 -66,41" fill="#34d399" filter="url(#glow)"/></g><polygon points="-72,44 72,116 60,122 -84,50" fill="#2b3a52" /><polygon class="chg4" points="-72,44 72,116 60,122 -84,50" fill="#fbbf24" filter="url(#glow)"/><polygon points="-90,53 54,125 42,131 -102,59" fill="#2b3a52" /><g class="scan"><polygon points="2,-1 162,79 158,81 -2,1" fill="#22d3ee" opacity="0.85" filter="url(#glow)"/></g><text class="mono" x="0" y="0" font-size="10" fill="#94a3b8" transform="translate(-114,74) skewY(26.565)">after.csv</text>
</g></g>
<text class="mono" x="884" y="124" font-size="11" fill="#64748b" text-anchor="end">AFTER</text>
<text class="mono" x="884" y="299" font-size="11" fill="#64748b" text-anchor="end">BEFORE</text>

</svg>
