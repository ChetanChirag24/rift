<text x="120" y="340" font-size="13" fill="#94a3b8" text-anchor="middle">CSV · Parquet · JSON,</text><text x="120" y="358" font-size="13" fill="#94a3b8" text-anchor="middle">or straight from a git commit</text><text x="450" y="340" font-size="13" fill="#94a3b8" text-anchor="middle">rows matched on your key,</text><text x="450" y="358" font-size="13" fill="#94a3b8" text-anchor="middle">every column compared in SQL</text><text x="790" y="340" font-size="13" fill="#94a3b8" text-anchor="middle">tables for humans, JSON for</text><text x="790" y="358" font-size="13" fill="#94a3b8" text-anchor="middle">scripts, exit codes for CI</text>

