<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="How rift works: load two datasets, compare them in DuckDB, report the differences">
<title>How rift works: load two datasets, compare them in DuckDB, report the differences</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#151b36"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#fbbf24" stop-opacity="0.05"/>
  <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
  <stop offset="1" stop-color="#fbbf24" stop-opacity="0.05"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="40" height="20" patternUnits="userSpaceOnUse">
  <path d="M0 10 L20 0 L40 10 L20 20 Z" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
</pattern>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

.flow { animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12 } }
.ring { animation: flow 1.2s linear infinite; }
.enginetop { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { fill: #2e1f5e } 50% { fill: #4c2fa3 } }
.bob { animation: bob 4s ease-in-out infinite; }
.bob2 { animation-delay: -2s; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

</style>

