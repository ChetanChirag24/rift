<text class="mono" x="28" y="78" font-size="14" xml:space="preserve"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e2e8f0">rift HEAD~1:data/customers.csv data/customers.csv -k customer_id</tspan></text>
