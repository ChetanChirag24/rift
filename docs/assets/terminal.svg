<rect class="caret" x="44.9" y="64" width="8" height="18" fill="#22d3ee"/>
<text class="mono l0" x="28" y="120" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">  Rows before     6</tspan></text><text class="mono l1" x="28" y="141" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">  Rows after      7</tspan></text><text class="mono l2" x="28" y="162" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">  Added          </tspan><tspan fill="#34d399">+2</tspan></text><text class="mono l3" x="28" y="183" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">  Removed        </tspan><tspan fill="#f87171">-1</tspan></text><text class="mono l4" x="28" y="204" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">  Changed        </tspan><tspan fill="#fbbf24">~2</tspan></text><text class="mono l5" x="28" y="225" font-size="14" xml:space="preserve"><tspan fill="#64748b">  Unchanged       3</tspan></text><text class="mono l7" x="28" y="267" font-size="14" xml:space="preserve"><tspan fill="#f87171">Removed rows</tspan></text><text class="mono l8" x="28" y="288" font-size="14" xml:space="preserve"><tspan fill="#f87171">│ 3  │ Initech   │ churned │ 0     │ West  │</tspan></text><text class="mono l9" x="28" y="309" font-size="14" xml:space="preserve"><tspan fill="#34d399">Added rows</tspan></text><text class="mono l10" x="28" y="330" font-size="14" xml:space="preserve"><tspan fill="#34d399">│ 7  │ Wayne Ent │ active  │ 30000 │ North │</tspan></text><text class="mono l11" x="28" y="351" font-size="14" xml:space="preserve"><tspan fill="#34d399">│ 8  │ Cyberdyne │ active  │ 5000  │ West  │</tspan></text><text class="mono l12" x="28" y="372" font-size="14" xml:space="preserve"><tspan fill="#fbbf24">Changed rows</tspan></text><text class="mono l13" x="28" y="393" font-size="14" xml:space="preserve"><tspan fill="#64748b">│ id │ column  │ before │ after   │</tspan></text><text class="mono l14" x="28" y="414" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">│ 1  │ revenue │ </tspan><tspan fill="#f87171">12000 </tspan><tspan fill="#e2e8f0"> │ </tspan><tspan fill="#34d399">13500  </tspan><tspan fill="#e2e8f0"> │</tspan></text><text class="mono l15" x="28" y="435" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">│ 2  │ status  │ </tspan><tspan fill="#f87171">active</tspan><tspan fill="#e2e8f0"> │ </tspan><tspan fill="#34d399">churned</tspan><tspan fill="#e2e8f0"> │</tspan></text><text class="mono l16" x="28" y="456" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">│    │ revenue │ </tspan><tspan fill="#f87171">8500  </tspan><tspan fill="#e2e8f0"> │ </tspan><tspan fill="#34d399">0      </tspan><tspan fill="#e2e8f0"> │</tspan></text><text class="mono l18" x="28" y="498" font-size="14" xml:space="preserve"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e2e8f0">echo $?</tspan><tspan fill="#64748b">   # 1 = differences found, handy in CI</tspan></text><text class="mono l19" x="28" y="519" font-size="14" xml:space="preserve"><tspan fill="#fbbf24">1</tspan></text>
</g>

