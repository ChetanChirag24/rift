name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by publish.yml so nothing is released without passing tests

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test the CLI
        shell: bash
        run: |
          rift --version
          set +e
          rift examples/customers_before.csv examples/customers_after.csv -k customer_id --summary
          code=$?
          set -e
          test "$code" -eq 1   # differences found => exit 1
